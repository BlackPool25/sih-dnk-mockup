# Auth service — Alembic configuration.
#
# CRITICAL: version_table = auth_alembic_version prevents collision with
# validation-engine's `core_alembic_version` and backend-core's tables.
# Each service owns its migration history independently.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Must match the backend-core plan — NEVER use the default `alembic_version`.
version_table = auth_alembic_version

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
