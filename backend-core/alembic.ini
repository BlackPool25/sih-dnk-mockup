# Backend-core — Alembic configuration.
#
# CRITICAL: version_table = core_alembic_version prevents collision with
# auth's `auth_alembic_version` and validation-engine's `alembic_version`.
# Each service owns its migration history independently.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Must NOT collide with auth_alembic_version or alembic_version.
version_table = core_alembic_version

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
