[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sih-dnk-backend-core"
version = "0.1.0"
description = "SIH-DNK backend-core — FastAPI service: profiles, orders, doc packs, QR codes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "qrcode[pil]>=7.4,<8",
    "jinja2>=3.1,<4",
    "weasyprint>=62,<70",
    "python-multipart>=0.0.20,<1",
    "sih-dnk-storage",
    "sih-dnk-auth",
]
[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.uv.sources]
sih-dnk-storage = { path = "../storage" }
sih-dnk-auth = { path = "../auth" }

[tool.hatch.build.targets.wheel]
packages = ["app", "app.routers", "app.services", "app.models", "app.schemas"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]
