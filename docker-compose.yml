# =============================================================================
# SIH-DNK Mockup — Docker Compose (dev stack: Postgres 16 + Redis 7 + 5 services)
# =============================================================================
# Host port 5433 is used because 5432 is live-occupied by internapply-postgres.
# ALL host ports are bound to 127.0.0.1 ONLY (never exposed to 0.0.0.0).
#
# Locked artifacts (plan §Locked compose artifacts) — DO NOT CHANGE:
#   name: sih-dnk-mockup | volume sih_dnk_pgdata | network dbnet
#   container sih-dnk-postgres | host port 127.0.0.1:5433:5432
# Port table (plan §Port allocation table, locked): see per-service comments.
# =============================================================================

name: sih-dnk-mockup

volumes:
  sih_dnk_pgdata:

networks:
  dbnet:

services:
  # ---------------------------------------------------------------------------
  # Service 1: PostgreSQL 16 (seeded volume sih_dnk_pgdata — do NOT touch)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sih-dnk-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: sih_dnk
      POSTGRES_USER: sih_dnk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
    volumes:
      - sih_dnk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_dnk -d sih_dnk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dbnet
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
      - -c
      - wal_buffers=8MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - default_statistics_target=100

  # ---------------------------------------------------------------------------
  # Service 2: Redis 7 (alpine) — 127.0.0.1:6379
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sih-dnk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 3: validation-engine — FastAPI dev server, 127.0.0.1:8001 -> 8000
  # Build context ./validation-engine; monorepo root live-mounted at /app so
  # edits never need a rebuild. Depends on db + redis being healthy.
  # ---------------------------------------------------------------------------
  validation-engine:
    build:
      context: ./validation-engine
    image: sih-dnk-validation-engine
    container_name: sih-dnk-validation-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${DB_PASSWORD:?error}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${DB_PASSWORD:?error}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_ENABLED: ${SARVAM_ENABLED:-false}
    volumes:
      - ./validation-engine:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 4: voice-pipeline (placeholder) — 127.0.0.1:8002 -> 8000
  # ---------------------------------------------------------------------------
  voice-pipeline:
    build:
      context: ./voice-pipeline
    image: sih-dnk-voice-pipeline
    container_name: sih-dnk-voice-pipeline
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_ENABLED: ${SARVAM_ENABLED:-false}
    volumes:
      - ./voice-pipeline:/app
      - ./voice-pipeline/models:/app/models
      - /app/.venv
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 5: pricing-engine (placeholder) — 127.0.0.1:8003 -> 8000
  # ---------------------------------------------------------------------------
  pricing-engine:
    build:
      context: ./pricing-engine
    image: sih-dnk-pricing-engine
    container_name: sih-dnk-pricing-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${DB_PASSWORD:?error}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-https://api.razorpay.com/v1}
    volumes:
      - ./pricing-engine:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 6: tracking-api — 127.0.0.1:8004 -> 8000
  # ---------------------------------------------------------------------------
  tracking-api:
    build:
      context: ./tracking-api
    image: sih-dnk-tracking-api
    container_name: sih-dnk-tracking-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${DB_PASSWORD:?error}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      TRACK17_API_KEY: ${TRACK17_API_KEY:-}
      TRACKING_PROVIDER: mock
    volumes:
      - ./tracking-api:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 7: frontend (nginx:alpine placeholder) — 127.0.0.1:8005 -> 80
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    image: sih-dnk-frontend
    container_name: sih-dnk-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:80"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 8: backend-core (FastAPI) — 127.0.0.1:8006 -> 8000
  # Build context ./backend-core; monorepo root live-mounted at /app so edits
  # never need a rebuild. Depends on db + redis being healthy.
  # ---------------------------------------------------------------------------
  backend-core:
    build:
      context: ./backend-core
    image: sih-dnk-backend-core
    container_name: sih-dnk-backend-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/opt/backend-core:/opt
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${DB_PASSWORD:?error}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-this-is-a-dev-secret-key-at-least-32-chars}
      - SAHAYAK_EMAIL=sahayak@dnk.gov.in
      - SAHAYAK_PASSWORD=sahayak-secret-123
      - DEMO_SELLER_EMAIL=sunita@handicrafts.in
      - DEMO_SELLER_PASSWORD=seller-secret-456
      - DEMO_BUYER_EMAIL=weber@example.com
      - DEMO_BUYER_PASSWORD=buyer-secret-789
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_ENABLED=${SARVAM_ENABLED:-false}
      - MARKETPLACE_URL=http://marketplace:8000
    volumes:
      - .:/app
    working_dir: /opt/backend-core
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ---------------------------------------------------------------------------
  # Service 9: marketplace — FastAPI, 127.0.0.1:8007 -> 8000
  # ---------------------------------------------------------------------------
  marketplace:
    build:
      context: ./marketplace
    image: sih-dnk-marketplace
    container_name: sih-dnk-marketplace
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${DB_PASSWORD:?error}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - ./marketplace:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Service 10: verification-service — FastAPI (mocked), 127.0.0.1:8008 -> 8000
  # ---------------------------------------------------------------------------
  verification-service:
    build:
      context: ./verification-service
    image: sih-dnk-verification-service
    container_name: sih-dnk-verification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${DB_PASSWORD:?error}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MOCK_VERIFICATION: "true"
      VERIFICATION_MODE: mock
    volumes:
      - ./verification-service:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbnet
