[project]
name = "voice-pipeline"
version = "0.1.0"
description = "SIH DNK voice-pipeline — STT/TTS/translate via the cloud Sarvam AI API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.16",
    "basedpyright>=1.18",
]

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["."]
exclude = ["tests", ".venv", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
