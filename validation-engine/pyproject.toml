[project]
name = "sih-dnk-mockup"
version = "0.1.0"
description = "SIH DNK export-enablement mockup — scaffold (models/schemas/services seeded in later todos)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "jinja2>=3.1,<4",
    "weasyprint>=62,<64",
    "pycountry>=24.6",
    "pytest>=8",
    "pytest-cov>=5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
    "google-generativeai>=0.8,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "basedpyright>=1.18",
]

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["."]
exclude = ["tests", "alembic", ".venv", "__pycache__"]
