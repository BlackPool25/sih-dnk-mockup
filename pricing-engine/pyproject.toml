[project]
name = "pricing-engine"
version = "0.1.0"
description = "SIH DNK pricing-engine component — placeholder scaffold (pricing team owns real implementation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "ortools>=9.15.6755",
]
[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]