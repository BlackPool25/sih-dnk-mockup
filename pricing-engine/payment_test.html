<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pricing Engine Test</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#202124}.card{background:#fff;padding:24px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:7px}button{padding:11px 16px;border:0;border-radius:7px;background:#111;color:#fff;cursor:pointer;margin-top:16px}button:disabled{opacity:.5;cursor:not-allowed}.result{white-space:pre-wrap;background:#f3f4f6;padding:15px;border-radius:8px}.success{padding:14px;background:#eaf8ee;border-radius:8px}.error{padding:14px;background:#fdecec;border-radius:8px}.tracking{margin-top:14px;padding:14px;background:#eef4ff;border-radius:8px}a{word-break:break-all}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
<h1>Pricing Engine + Razorpay Test</h1>
<p>Test-only buyer page. The buyer enters shipment details, receives a calculated quote, and requests a Razorpay payment link. Merchant credentials stay on the backend.</p>
<div class="card"><h2>Shipment</h2><div class="grid">
<div><label>Starting location</label><input id="origin" value="India"></div>
<div><label>Destination country (ISO-2)</label><input id="country" value="US" maxlength="2"></div>
<div><label>Destination postal code</label><input id="postal" value="10001"></div>
<div><label>Currency</label><input id="currency" value="INR" maxlength="3"></div>
<div><label>Product value (₹)</label><input id="productValue" type="number" value="5000" min="1"></div>
<div><label>Quantity</label><input id="quantity" type="number" value="1" min="1"></div>
<div><label>Weight per item (g)</label><input id="weight" type="number" value="2000" min="1"></div>
<div><label>Length (cm)</label><input id="length" type="number" value="30" min="1"></div>
<div><label>Width (cm)</label><input id="width" type="number" value="20" min="1"></div>
<div><label>Height (cm)</label><input id="height" type="number" value="10" min="1"></div>
</div><button id="calculate">Calculate Cost</button></div>
<div class="card" id="pricingCard" hidden><h2>Pricing result</h2><div id="pricingResult" class="result"></div><button id="paymentButton">Generate Payment Link</button><div id="paymentResult" style="margin-top:15px"></div></div>
<script>
let latestPaymentLinkId=null;const $=id=>document.getElementById(id);const money=minor=>`${(minor/100).toFixed(2)} ${$('currency').value.toUpperCase()}`;
function lane(name){return name==='EMS'?{name:'EMS',lane:'EMS',first_slab_g:50,first_slab_rate_minor:100,addl_slab_g:50,addl_slab_rate_minor:20,weight_cap_g:20000,volume_free:false,divisor:5000,transit_min_days:7,transit_max_days:14,provenance:{source:'TEST_UI'}}:{name:'ITPS',lane:'ITPS',first_slab_g:50,first_slab_rate_minor:100,addl_slab_g:50,addl_slab_rate_minor:20,weight_cap_g:5000,volume_free:true,divisor:null,transit_min_days:18,transit_max_days:28,provenance:{source:'TEST_UI'}};}
$('calculate').onclick=async()=>{ $('pricingCard').hidden=false;$('pricingResult').textContent='Calculating...';$('paymentResult').innerHTML='';$('paymentButton').disabled=true;const country=$('country').value.trim().toUpperCase(),currency=$('currency').value.trim().toUpperCase(),product=Math.round(Number($('productValue').value)*100);const payload={items:[{item_id:'TEST-ITEM-001',quantity:Number($('quantity').value),unit_weight_g:Number($('weight').value),splittable:true,length_cm:Number($('length').value),width_cm:Number($('width').value),height_cm:Number($('height').value)}],packages:[{package_id:'TEST-PACKAGE-001',name:'Standard Test Package',tare_weight_g:100,length_cm:Number($('length').value)+2,width_cm:Number($('width').value)+2,height_cm:Number($('height').value)+2,cost_minor:100,max_product_weight_g:5000}],lanes:[lane('ITPS'),lane('EMS')],optimization_mode:'CHEAPEST',landed_cost:{destination_country:country,currency,product_value_minor:product,insurance_minor:0,other_additions_minor:0,standard_duty_rate_percent:10,tax_rate_percent:18,include_duty_in_tax_base:true,additional_tax_base_minor:0,preferential_eligible:false,preferential_rate_percent:null,preferential_agreement:null,preferential_reason:null,country_fee_components:[],platform_fee_rate_percent:0,platform_fixed_fee_minor:0}};try{const r=await fetch('/pricing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await r.json();if(!r.ok)throw new Error(data.detail?.message||JSON.stringify(data));const shipping=data.landed_cost?.shipping_cost_minor??data.cost.shipping_cost_minor,paymentAmount=product+shipping;$('pricingResult').textContent=`Origin: ${$('origin').value}\nDestination: ${country} ${$('postal').value}\n\nProduct value: ${money(product)}\nShipping: ${money(shipping)}\nDuty: ${money(data.landed_cost?.duty?.duty_minor||0)} (estimate only)\nTax: ${money(data.landed_cost?.tax?.tax_minor||0)} (estimate only)\n\nEstimated landed cost: ${money(data.landed_cost?.landed_cost_minor||data.cost.total_cost_minor)}\n\nRazorpay payment amount: ${money(paymentAmount)}\n(Duty/tax are excluded from the payment amount.)`;$('paymentButton').disabled=false;$('paymentButton').dataset.amount=paymentAmount;}catch(e){$('pricingResult').innerHTML=`<div class="error">${e.message}</div>`;}};
async function refreshPaymentStatus(){if(!latestPaymentLinkId)return;try{const r=await fetch(`/payment/link-status/${encodeURIComponent(latestPaymentLinkId)}`),data=await r.json();if(!r.ok)throw new Error(data.detail?.message||JSON.stringify(data));$('tracking').innerHTML=`<strong>Money tracking</strong><br><br>Status: ${data.status}<br>Amount paid: ${money(data.amount_paid)}<br>Destination: ${data.destination}<br>Current location: <strong>${data.money_location}</strong><br><br>${data.settlement_note}`;}catch(e){$('tracking').innerHTML=`<div class="error">${e.message}</div>`;}}
$('paymentButton').onclick=async()=>{$('paymentButton').disabled=true;$('paymentResult').innerHTML='Generating payment link...';try{const amount=Number($('paymentButton').dataset.amount),ref=`TEST-${Date.now()}`,r=await fetch('/payment/create-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount_minor:amount,currency:$('currency').value.trim().toUpperCase(),reference_id:ref,description:`Shipment payment ${ref}`,notes:{origin:$('origin').value,destination:$('country').value.trim().toUpperCase(),postal_code:$('postal').value}})}),data=await r.json();if(!r.ok)throw new Error(data.detail?.message||JSON.stringify(data));latestPaymentLinkId=data.payment_link_id;$('paymentResult').innerHTML=`<div class="success"><strong>Payment link generated.</strong><br><br><a href="${data.short_url}" target="_blank" rel="noopener">${data.short_url}</a><br><br>Razorpay status: ${data.status}<br>Destination: ${data.destination}<div id="tracking" class="tracking">Checking payment status...</div></div>`;await refreshPaymentStatus();$('paymentButton').disabled=false;}catch(e){$('paymentResult').innerHTML=`<div class="error">${e.message}</div>`;$('paymentButton').disabled=false;}};setInterval(refreshPaymentStatus,5000);
</script></body></html>
